# Build verification for every push and pull request.
#
# The deploy hosts already build this project — Vercel runs the frontend build, Render
# builds the Docker image — but they only do it *after* code reaches main, so a broken
# commit is discovered once it is already the deployed branch. That happened: a build
# failed on Vercel because five files had unused imports, which `tsc --noEmit` does not
# flag but the real `tsc -b` does. This workflow runs the same commands the deploy hosts
# run, on every push and every pull request, so the failure surfaces on the commit that
# caused it instead of after the fact.
#
# Deliberately does NOT deploy anything. Its only job is to answer "does this still
# build?" — deployment stays with Vercel and Render.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Only the newest commit on a branch is worth checking: if two pushes land close
# together, the older run is testing code nobody will ship. cancel-in-progress is right
# here and wrong for migrate-to-r2 — cancelling a build wastes nothing, while cancelling
# a half-finished upload would leave the bucket inconsistent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Three independent jobs rather than three steps in one: they run in parallel, and a
  # frontend type error still lets the backend result through, so one run tells you
  # everything that is broken instead of only the first thing.
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile (nodesource setup_22.x) so CI cannot pass on a Node
          # version the deploy never uses.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly what package-lock.json
      # pins and fails if the lockfile and package.json disagree. `npm install` would
      # happily resolve a newer dependency, so CI could pass against packages the deploy
      # never sees.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # The real build command from package.json — `tsc -b && vite build`. Running
      # `tsc --noEmit` instead would be a weaker check: this repo uses a solution-style
      # root tsconfig, and --noEmit skips the project references where noUnusedLocals
      # actually applies. Always run what the deploy host runs.
      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci

      # `tsc` — compiles src/ to dist/, which is what `npm start` runs in the container.
      - name: Build
        working-directory: backend
        run: npm run build

  scripts:
    name: Python scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Same version as the Dockerfile's python:3.13-slim base and the migration
          # workflow, so a syntax difference between versions cannot slip through.
          python-version: '3.13'

      # A syntax check, not a test run: these scripts need FastF1, a populated cache and
      # a residential IP to do anything real (F1 returns 403 to data-centre addresses),
      # so they cannot execute here. Compiling still catches the cheap class of mistake —
      # a typo or bad indentation that would otherwise only appear when a race is being
      # generated by hand, minutes into a FastF1 load.
      - name: Compile-check data scripts
        run: python -m compileall -q data_scripts .github/scripts
