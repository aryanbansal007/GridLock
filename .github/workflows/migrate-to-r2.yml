# Copies generated artifacts from the gridlock-data repo into Cloudflare R2.
#
# Unlike generation, this runs happily on a hosted runner: it only talks to GitHub and
# Cloudflare, never to livetiming.formula1.com (which returns 403 to data-centre IPs —
# see fastf1-connectivity-test.yml). Running it here rather than from a laptop also
# means ~600MB is uploaded over GitHub's connection instead of a home one.
#
# Start with `only` set to a single session to prove the pipe end to end before moving
# everything, and `dry_run` to preview without writing.
name: Migrate gridlock-data to R2

# Manual only. This is how a newly generated race reaches the site: generate locally
# (F1 blocks data-centre IPs, so it cannot run here), push to gridlock-data, then run
# this. Re-running is safe — it overwrites the same keys and rewrites the index, and a
# few hundred writes is nothing against R2's monthly allowance.
on:
  # Hourly, because the backend regenerates season/<year>/{calendar,standings}.json on
  # its own hourly schedule and pushes them to gridlock-data — but nothing carried them
  # onward to R2, which is what the browser actually reads. Without this the calendar
  # drifts: a finished race keeps showing as upcoming, with a countdown to a date that
  # has passed, until someone runs this by hand.
  #
  # :20 rather than :00 so the backend's own refresh and push have finished first.
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Comma-separated key prefixes, e.g. 2026/belgian_grand_prix/R (blank = everything)'
        required: false
        default: ''
      dry_run:
        description: 'List what would upload without writing anything'
        type: boolean
        required: false
        default: false

env:
  # Scheduled runs sync only the small aggregates the backend rewrites — a few dozen
  # files rather than all 400+. Telemetry is immutable once generated, so re-uploading
  # it every hour would burn through the monthly write allowance to change nothing; a
  # new race is published by running this manually with a blank filter.
  SCHEDULED_PATHS: 'season,session_results,schedule'

# One migration at a time — concurrent runs would race on the same keys.
concurrency:
  group: migrate-to-r2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install boto3
        run: pip install --quiet boto3

      # gridlock-data is public, so this needs no credentials. Full clone rather than
      # --depth 1: the checkout is thrown away with the runner, and a shallow clone
      # saves little here because the working tree, not the history, is the bulk.
      - name: Fetch gridlock-data
        run: |
          git clone --quiet https://github.com/aryanbansal007/gridlock-data.git gridlock-data
          echo "Files in checkout: $(git -C gridlock-data ls-files | wc -l)"

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SOURCE_DIR: gridlock-data
          # `inputs` is unavailable on a scheduled run, so fall back to the narrow set.
          ONLY: ${{ github.event_name == 'schedule' && env.SCHEDULED_PATHS || inputs.only }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/migrate_to_r2.py
