# Copies generated artifacts from the gridlock-data repo into Cloudflare R2.
#
# Unlike generation, this runs happily on a hosted runner: it only talks to GitHub and
# Cloudflare, never to livetiming.formula1.com (which returns 403 to data-centre IPs —
# see fastf1-connectivity-test.yml). Running it here rather than from a laptop also
# means ~600MB is uploaded over GitHub's connection instead of a home one.
#
# Start with `only` set to a single session to prove the pipe end to end before moving
# everything, and `dry_run` to preview without writing.
name: Migrate gridlock-data to R2

# The Run button only appears for workflows on the default branch, and putting this on
# main purely to click it would trigger a Render redeploy and another ~10 minute cache
# hydration on the live site. So while this branch is in progress it also runs on a push
# that touches this file — editing PUSH_ONLY below and pushing is the trigger. Once the
# branch merges, the push trigger can go and workflow_dispatch takes over.
on:
  push:
    branches:
      - feat/r2-migration
    paths:
      - '.github/workflows/migrate-to-r2.yml'
      - '.github/scripts/migrate_to_r2.py'
  workflow_dispatch:
    inputs:
      only:
        description: 'Key prefix to limit the upload, e.g. 2026/belgian_grand_prix/R (blank = everything)'
        required: false
        default: ''
      dry_run:
        description: 'List what would upload without writing anything'
        type: boolean
        required: false
        default: false

env:
  # Only consulted on push runs, where `inputs` is unavailable. Was pinned to a single
  # session to prove the pipe end to end (uploaded, publicly fetchable, right
  # Content-Type/Cache-Control, CORS header present) before moving everything. Now blank
  # for the full migration, which also lets races-index.json be written.
  PUSH_ONLY: ''

# One migration at a time — concurrent runs would race on the same keys.
concurrency:
  group: migrate-to-r2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install boto3
        run: pip install --quiet boto3

      # gridlock-data is public, so this needs no credentials. Full clone rather than
      # --depth 1: the checkout is thrown away with the runner, and a shallow clone
      # saves little here because the working tree, not the history, is the bulk.
      - name: Fetch gridlock-data
        run: |
          git clone --quiet https://github.com/aryanbansal007/gridlock-data.git gridlock-data
          echo "Files in checkout: $(git -C gridlock-data ls-files | wc -l)"

      - name: Upload to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          SOURCE_DIR: gridlock-data
          # inputs.* are empty on a push run, so fall back to the env default above.
          ONLY: ${{ inputs.only || env.PUSH_ONLY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: python .github/scripts/migrate_to_r2.py
